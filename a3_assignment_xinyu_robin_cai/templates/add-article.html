<!DOCTYPE html>

<head>

</head>
<body>
    <h1>Add new article</h1>
    
    <form action="/confirm-add" method="POST">
        title<textarea name="title" type="text" rows = "5" cols="50"></textarea>
        <hr>
        author<input name="author" type="text">
        <hr>
        content<textarea name="content" type="text" rows = "10" cols="50"></textarea>
        <hr>
        image<textarea name="image" type="text" rows = "5" cols="50"></textarea>
        <hr>
        is feature<input name="isfeature" type="checkbox" value="1">
        <hr>

        <input type="submit">
    </form>
    <a href="/">Home</a>
</body>
</html>
